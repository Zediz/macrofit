<ion-content class="auth-screen">
  <div class="auth-wrap">
    <div class="brand-mark" aria-hidden="true">M</div>
    <p class="eyebrow">Nutrición diaria</p>
    <h1>Macrofit</h1>
    <p class="lede">Registra lo que comes, mira lo que falta y ajusta tus metas sin hojas de cálculo.</p>

    <ion-segment [value]="mode()" (ionChange)="setMode($event)">
      <ion-segment-button value="login"><ion-label>Entrar</ion-label></ion-segment-button>
      <ion-segment-button value="register"><ion-label>Crear cuenta</ion-label></ion-segment-button>
    </ion-segment>

    <form class="stack" (submit)="$event.preventDefault(); submit()">
      @if (mode() === 'register') {
        <ion-input label="Nombre" labelPlacement="stacked" fill="outline" [value]="name()" (ionInput)="name.set(text($event))"></ion-input>
      }
      <ion-input label="Correo" labelPlacement="stacked" fill="outline" type="email" inputmode="email" autocomplete="email" [value]="email()" (ionInput)="email.set(text($event))"></ion-input>
      <ion-input label="Contraseña" labelPlacement="stacked" fill="outline" type="password" autocomplete="current-password" [value]="password()" (ionInput)="password.set(text($event))"></ion-input>
      <ion-button expand="block" type="submit" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          {{ mode() === 'login' ? 'Entrar' : 'Crear mi cuenta' }}
        }
      </ion-button>
    </form>
  </div>
</ion-content>
